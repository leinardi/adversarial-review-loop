[mypy]

python_version = 3.12
mypy_path = scripts
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
# All params must be typed.
disallow_incomplete_defs = True
# Functions need type hints.
disallow_untyped_defs = True
# Still analyze bodies if hints are missing.
check_untyped_defs = True
pretty = True
show_error_codes = True

# Vendored third-party code is kept byte-identical to upstream.
[mypy-ocrl._vendor.*]
ignore_errors = True
