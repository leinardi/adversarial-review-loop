line-length = 150
target-version = "py312"

# Vendored third-party code is kept diffable against upstream: the only change to it is the
# import rewrite recorded in scripts/arl/_vendor/README.md.
extend-exclude = ["scripts/arl/_vendor"]

[lint]
# Ruff always enables E and F by default; we extend that set.
extend-select = [
    "I", # import sorting (isort)
    "PL", # pylint-compatible rules (subset)
    "UP", # pyupgrade
    "B", # bugbear
    "SIM", # flake8-simplify
    "C4", # comprehensions
    "ERA", # eradicate (commented-out code)
    "W", # pycodestyle warnings
    "RUF", # Ruff-specific rules
]

ignore = [
    # add ignores as needed
]

[lint.per-file-ignores]
# Both carry a shebang for the reader, and neither may be executed by its own path. The gate's
# only sanctioned invocation is `python3 -I "$PLUGIN_ROOT/scripts/arl-bootstrap.py"` (see
# AGENTS.md, "Interpreter invocation"), and `sync_pins.py` is run as `python3 scripts/sync_pins.py`
# from the Makefile. Making them executable would invite the direct call rather than record it.
"scripts/arl-bootstrap.py" = ["EXE001"]
"scripts/sync_pins.py" = ["EXE001"]

[lint.isort]
# The package lives under scripts/, which isort cannot infer from the layout.
known-first-party = ["arl"]

[lint.pylint]
allow-magic-value-types = ["str", "int"]

[format]
quote-style = "double"
