version: 2

# pip and pre-commit share one pull request. pytest is pinned in requirements-dev.txt and again in
# the mypy hooks' additional_dependencies, and each ecosystem bumps only its own copy; as two
# pull requests, each one fails tests/unit/test_pins.py until the other has merged.
multi-ecosystem-groups:
  dev-tools:
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    # requirements-dev.txt and the hook revs never ship: the plugin itself has no runtime
    # dependencies, so a bump here stays chore(deps).
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    multi-ecosystem-group: "dev-tools"
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "dev-tools"
    patterns: ["*"]
    cooldown:
      default-days: 7
